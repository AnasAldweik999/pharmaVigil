services:
  postgres:
    image: postgres:16
    container_name: pharmavigil-db
    environment:
      POSTGRES_DB: pharmavigil
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pharmavigil_data:/var/lib/postgresql/data

volumes:
  pharmavigil_data:
