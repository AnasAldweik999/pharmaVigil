spring.application.name=pharmavigil-platform
application.title=PharmaVigil
application.version=1.0.0

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Amman
spring.jackson.time-zone=Asia/Amman
spring.jpa.show-sql=false
spring.liquibase.drop-first=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000

spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.from=noreply@pharmavigiltrack.com
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.base-url=http://localhost:4200
app.admin-base-url=http://localhost:4201
app.cors.allowed-origins=http://localhost:4200,http://localhost:4201

app.default-admin.email=${ADMIN_EMAIL}
app.default-admin.password=${ADMIN_PASSWORD}

app.department.allowed-units=Kilo,Tablets,Blisters,Tube,Box,Jars,Bottle

app.batch-no.regex=^[A-Za-z0-9]{1,50}$

app.holding.general-threshold-days=45
app.holding.check-cron=0 0 0/4 * * *
app.holding.alert-email.enabled=true
